# Production app. Previews per PR reuse this file with another app name (see .github/workflows/preview.yml).
# Secrets (fly secrets set …): DATABASE_URL (Neon -pooler), DATABASE_URL_DIRECT, JWT_SECRET, SMTP_URL,
# MAIL_FROM, APP_URL, API_URL, plus optional SENTRY_DSN, REDIS_URL, GOOGLE_*/GITHUB_* — docs/ops/production.md.
app = "dashapp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  COOKIE_SECURE = "true"
  LOG_LEVEL = "info"

[deploy]
  # Runs once per deploy, before new machines start, over DATABASE_URL_DIRECT (no pooler).
  release_command = "node dist/db/migrate.js"
  strategy = "rolling"

[http_service]
  internal_port = 3000
  force_https = true
  # Sockets and the reminder timer need a live process: never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
