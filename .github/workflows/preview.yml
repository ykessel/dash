# One preview per PR: a Neon branch (copy of the seed-only "preview" branch) and a Fly app, torn down on close.
# Needs: secrets NEON_API_KEY, FLY_API_TOKEN, PREVIEW_JWT_SECRET, PREVIEW_SMTP_URL;
#        variables NEON_PROJECT_ID, FLY_ORG. See docs/ops/production.md.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}

env:
  APP: pane-pr-${{ github.event.number }}
  BRANCH: pr-${{ github.event.number }}

jobs:
  # CI already tests every PR (ci.yml); a preview goes up regardless so a broken one can be looked at.
  deploy:
    # Forks don't get secrets; their PRs run CI only.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://${{ env.APP }}.fly.dev
    steps:
      - uses: actions/checkout@v4
      - id: db
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.BRANCH }}
          # Never the production branch: previews are public URLs. "preview" holds seed data only.
          parent: preview
          api_key: ${{ secrets.NEON_API_KEY }}
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Create the app once
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps list --json | jq -e --arg a "$APP" 'any(.[]; .Name == $a)' > /dev/null || flyctl apps create "$APP" --org "${{ vars.FLY_ORG }}"
      - name: Secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set --app "$APP" --stage \
            DATABASE_URL="${{ steps.db.outputs.db_url_pooled }}" \
            DATABASE_URL_DIRECT="${{ steps.db.outputs.db_url }}" \
            JWT_SECRET="${{ secrets.PREVIEW_JWT_SECRET }}" \
            SMTP_URL="${{ secrets.PREVIEW_SMTP_URL }}" \
            MAIL_FROM="Pane preview <no-reply@pane.dev>" \
            APP_URL="https://$APP.fly.dev" \
            API_URL="https://$APP.fly.dev"
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --app "$APP" --config fly.toml --remote-only --ha=false

  teardown:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Destroy the app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps destroy "$APP" --yes || true
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
