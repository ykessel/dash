name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so Deploy's run never cancels a CI run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pane
          POSTGRES_PASSWORD: pane
          POSTGRES_DB: pane_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pane" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pane:pane@localhost:5432/pane_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Web — unit tests, types, build
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

      - name: API — types and unit tests
        working-directory: server
        run: |
          pnpm exec tsc --noEmit -p tsconfig.json
          pnpm test

      - name: API — e2e (Postgres + Redis)
        working-directory: server
        run: pnpm test:e2e

      - name: Image builds
        run: docker build -t pane:ci .
