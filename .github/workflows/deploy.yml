# Production: every push to main that passes CI. Migrations run in fly.toml's release_command.
# Needs: secret FLY_API_TOKEN; the app's runtime secrets are set once with `fly secrets set`.
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dashapp.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      # DEMO_EMAIL / DEMO_PASSWORD (repo variables) prefill the sign-in form; leave them unset for a normal login.
      - run: >-
          flyctl deploy --config fly.toml --remote-only
          --build-arg VITE_DEMO_EMAIL="$DEMO_EMAIL"
          --build-arg VITE_DEMO_PASSWORD="$DEMO_PASSWORD"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ vars.DEMO_PASSWORD }}
